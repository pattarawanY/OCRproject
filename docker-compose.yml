services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartclaim
      POSTGRES_PASSWORD: smartclaim
      POSTGRES_DB: smartclaim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartclaim"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://smartclaim:smartclaim@db:5432/smartclaim
      PDF_FONT_PATH: /usr/share/fonts/truetype/tlwg/Garuda.ttf
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
